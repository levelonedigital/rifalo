<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFALO - Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  .contenedor { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { color: #22c55e; margin-bottom: 8px; }
  h2 { margin: 16px 0 8px; color: #93c5fd; }
  .tarjeta { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 6px 0 2px; font-size: 14px; color: #94a3b8; }
  input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  button { margin: 6px 4px 0 0; padding: 8px 14px; border: none; border-radius: 6px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  button.secundario { background: #334155; color: #e2e8f0; }
  button.peligro { background: #dc2626; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #334155; text-align: left; }
  th { color: #93c5fd; }
  .fila-botones { display: flex; flex-wrap: wrap; gap: 4px; }
  .mensaje { padding: 10px; border-radius: 6px; margin: 8px 0; display: none; }
  .mensaje.ok { display: block; background: #14532d; }
  .mensaje.error { display: block; background: #7f1d1d; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .tabs button { background: #334155; color: #e2e8f0; }
  .tabs button.activa { background: #22c55e; color: #052e16; }
  .chico { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="contenedor">

  <!-- LOGIN -->
  <div id="zona-login" class="tarjeta">
    <h1>RIFALO</h1>
    <p class="chico">Ingreso de administradores</p>
    <label>Usuario</label><input id="login-usuario">
    <label>Contrasenia</label><input id="login-password" type="password">
    <label>Codigo 2FA (solo si lo tenes activado)</label><input id="login-2fa">
    <button onclick="login()">Entrar</button>
    <div id="login-error" class="mensaje error"></div>
  </div>

  <!-- PANEL -->
  <div id="zona-panel" style="display:none">
    <h1>RIFALO <span class="chico" id="panel-usuario"></span></h1>
    <div class="tabs">
      <button id="tab-sorteos" class="activa" onclick="irTab('sorteos')">Sorteos</button>
      <button id="tab-jugadas" onclick="irTab('jugadas')">Jugadas pendientes</button>
      <button id="tab-revendedores" onclick="irTab('revendedores')">Revendedores</button>
      <button id="tab-auditoria" onclick="irTab('auditoria')">Auditoria</button>
      <button class="peligro" onclick="salir()">Salir</button>
    </div>
    <div id="mensaje" class="mensaje"></div>

    <!-- SORTEOS -->
    <div id="seccion-sorteos" class="tarjeta">
      <h2>Crear sorteo</h2>
      <label>Modulo</label>
      <select id="sorteo-modulo">
        <option value="clasico">Clasico</option>
        <option value="rifa">Rifa</option>
        <option value="semanal">Semanal</option>
      </select>
      <label>Fecha y hora del sorteo</label>
      <input id="sorteo-fecha" type="datetime-local">
      <label>Premio fijo (solo rifa)</label>
      <input id="sorteo-premio" type="number">
      <button onclick="crearSorteo()">Crear</button>
      <h2>Sorteos existentes</h2>
      <div id="lista-sorteos"></div>
    </div>

    <!-- JUGADAS -->
    <div id="seccion-jugadas" class="tarjeta" style="display:none">
      <h2>Jugadas pendientes de aprobacion</h2>
      <button class="secundario" onclick="cargarJugadas()">Actualizar</button>
      <div id="lista-jugadas"></div>
    </div>

    <!-- REVENDEDORES -->
    <div id="seccion-revendedores" class="tarjeta" style="display:none">
      <h2>Crear revendedor</h2>
      <label>Usuario</label><input id="rev-usuario">
      <label>Contrasenia</label><input id="rev-password" type="password">
      <label>Nombre</label><input id="rev-nombre">
      <label>Telefono</label><input id="rev-telefono">
      <label>Codigo (ej: R1)</label><input id="rev-codigo">
      <label>Comision %</label><input id="rev-comision" type="number" value="10">
      <label>Datos de transferencia</label><input id="rev-transferencia">
      <button onclick="crearRevendedor()">Crear</button>
      <h2>Revendedores existentes</h2>
      <div id="lista-revendedores"></div>
    </div>

    <!-- AUDITORIA -->
    <div id="seccion-auditoria" class="tarjeta" style="display:none">
      <h2>Ultimos movimientos</h2>
      <button class="secundario" onclick="cargarAuditoria()">Actualizar</button>
      <div id="lista-auditoria"></div>
    </div>
  </div>
</div>

<script>
const BASE = "";
let token = localStorage.getItem("rifalo_token") || null;

function cabeceras() {
  return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
}

async function api(ruta, metodo, cuerpo) {
  const respuesta = await fetch(BASE + ruta, {
    method: metodo,
    headers: cabeceras(),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  if (respuesta.status === 401) { salir(); throw new Error("Sesion expirada, entra de nuevo"); }
  const datos = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) throw new Error(datos.detail || "Error " + respuesta.status);
  return datos;
}

function aviso(texto, esError) {
  const caja = document.getElementById("mensaje");
  caja.className = "mensaje " + (esError ? "error" : "ok");
  caja.textContent = texto;
  setTimeout(() => { caja.className = "mensaje"; }, 4000);
}

async function login() {
  const cuerpo = {
    usuario: document.getElementById("login-usuario").value,
    password: document.getElementById("login-password").value,
  };
  const dosfa = document.getElementById("login-2fa").value;
  if (dosfa) cuerpo.codigo_2fa = dosfa;
  try {
    const datos = await fetch(BASE + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo),
    }).then(r => r.json());
    if (!datos.token) throw new Error(datos.detail || "Credenciales incorrectas");
    token = datos.token;
    localStorage.setItem("rifalo_token", token);
    localStorage.setItem("rifalo_nombre", datos.nombre);
    mostrarPanel();
  } catch (e) {
    const caja = document.getElementById("login-error");
    caja.className = "mensaje error";
    caja.textContent = e.message;
  }
}

function salir() {
  token = null;
  localStorage.removeItem("rifalo_token");
  document.getElementById("zona-panel").style.display = "none";
  document.getElementById("zona-login").style.display = "block";
}

function mostrarPanel() {
  document.getElementById("zona-login").style.display = "none";
  document.getElementById("zona-panel").style.display = "block";
  document.getElementById("panel-usuario").textContent = "- " + (localStorage.getItem("rifalo_nombre") || "");
  irTab("sorteos");
}

function irTab(nombre) {
  ["sorteos", "jugadas", "revendedores", "auditoria"].forEach(s => {
    document.getElementById("seccion-" + s).style.display = s === nombre ? "block" : "none";
    document.getElementById("tab-" + s).className = s === nombre ? "activa" : "";
  });
  if (nombre === "sorteos") cargarSorteos();
  if (nombre === "jugadas") cargarJugadas();
  if (nombre === "revendedores") cargarRevendedores();
  if (nombre === "auditoria") cargarAuditoria();
}

// ---------- SORTEOS ----------
async function crearSorteo() {
  const cuerpo = {
    modulo: document.getElementById("sorteo-modulo").value,
    fecha_sorteo: document.getElementById("sorteo-fecha").value,
  };
  const premio = document.getElementById("sorteo-premio").value;
  if (premio) cuerpo.premio_fijo = parseFloat(premio);
  try {
    const datos = await api("/admin/sorteos", "POST", cuerpo);
    aviso("Sorteo creado con id " + datos.id);
    cargarSorteos();
  } catch (e) { aviso(e.message, true); }
}

async function cargarSorteos() {
  try {
    const sorteos = await api("/admin/sorteos", "GET");
    let html = "<table><tr><th>Id</th><th>Modulo</th><th>Fecha</th><th>Estado</th><th>Resultado</th><th>Acciones</th></tr>";
    sorteos.forEach(s => {
      html += "<tr><td>" + s.id + "</td><td>" + s.modulo + "</td><td>" + s.fecha_sorteo.slice(0, 16).replace("T", " ") + "</td><td>" + s.estado + "</td><td>" + (s.resultado_numero ?? "-") + "</td><td class='fila-botones'>";
      if (s.estado === "programado") html += "<button class='secundario' onclick='cerrarSorteo(" + s.id + ")'>Cerrar</button>";
      if (s.estado === "cerrado") html += "<button onclick='cargarResultado(" + s.id + ")'>Cargar resultado</button>";
      html += "<button class='secundario' onclick='verResumen(" + s.id + ")'>Resumen</button></td></tr>";
    });
    document.getElementById("lista-sorteos").innerHTML = html + "</table>";
  } catch (e) { aviso(e.message, true); }
}

async function cerrarSorteo(id) {
  try { await api("/admin/sorteos/" + id + "/cerrar", "POST"); aviso("Sorteo " + id + " cerrado"); cargarSorteos(); }
  catch (e) { aviso(e.message, true); }
}

async function cargarResultado(id) {
  const numero = prompt("Numero oficial del sorteo (0-99):");
  if (numero === null) return;
  try {
    const resumen = await api("/admin/sorteos/" + id + "/resultado", "POST", { numero: parseInt(numero) });
    aviso("Liquido: " + resumen.ganadoras + " ganadoras, premios $" + resumen.total_premios);
    cargarSorteos();
  } catch (e) { aviso(e.message, true); }
}

async function verResumen(id) {
  try {
    const r = await api("/admin/sorteos/" + id + "/resumen", "GET");
    alert("Sorteo " + r.sorteo_id + " (" + r.modulo + ")\nEstado: " + r.estado +
      "\nResultado: " + (r.resultado_numero ?? "-") +
      "\nJugadas aprobadas: " + r.jugadas_aprobadas +
      "\nRecaudado: $" + r.recaudado +
      "\nComisiones: $" + r.comisiones +
      "\nPremios: $" + r.premios +
      "\nGanadoras (ids): " + (r.ganadoras.join(", ") || "ninguna") +
      "\nPozo acumulado: $" + r.pozo_acumulado);
  } catch (e) { aviso(e.message, true); }
}

// ---------- JUGADAS ----------
async function cargarJugadas() {
  try {
    const jugadas = await api("/admin/jugadas/pendientes", "GET");
    if (!jugadas.length) { document.getElementById("lista-jugadas").innerHTML = "<p class='chico'>No hay jugadas pendientes.</p>"; return; }
    let html = "<table><tr><th>Id</th><th>Sorteo</th><th>Revendedor</th><th>Jugador</th><th>Numero</th><th>Monto</th><th>Acciones</th></tr>";
    jugadas.forEach(j => {
      html += "<tr><td>" + j.id + "</td><td>" + j.sorteo_id + "</td><td>" + j.revendedor_id + "</td><td>" + (j.jugador_nombre || "-") + "</td><td>" + j.numero + "</td><td>$" + j.monto + "</td><td class='fila-botones'><button onclick='aprobarJugada(" + j.id + ")'>Aprobar</button><button class='peligro' onclick='rechazarJugada(" + j.id + ")'>Rechazar</button></td></tr>";
    });
    document.getElementById("lista-jugadas").innerHTML = html + "</table>";
  } catch (e) { aviso(e.message, true); }
}

async function aprobarJugada(id) {
  try { await api("/admin/jugadas/" + id + "/aprobar", "POST"); aviso("Jugada " + id + " aprobada"); cargarJugadas(); }
  catch (e) { aviso(e.message, true); }
}

async function rechazarJugada(id) {
  try { await api("/admin/jugadas/" + id + "/rechazar", "POST"); aviso("Jugada " + id + " rechazada"); cargarJugadas(); }
  catch (e) { aviso(e.message, true); }
}

// ---------- REVENDEDORES ----------
async function crearRevendedor() {
  const cuerpo = {
    usuario: document.getElementById("rev-usuario").value,
    password: document.getElementById("rev-password").value,
    nombre: document.getElementById("rev-nombre").value,
    telefono: document.getElementById("rev-telefono").value || null,
    codigo: document.getElementById("rev-codigo").value,
    comision_pct: parseFloat(document.getElementById("rev-comision").value),
    datos_transferencia: document.getElementById("rev-transferencia").value || null,
  };
  try {
    await api("/admin/revendedores", "POST", cuerpo);
    aviso("Revendedor creado");
    cargarRevendedores();
  } catch (e) { aviso(e.message, true); }
}

async function cargarRevendedores() {
  try {
    const revs = await api("/admin/revendedores", "GET");
    let html = "<table><tr><th>Id</th><th>Usuario</th><th>Nombre</th><th>Codigo</th><th>Comision</th><th>Activo</th><th>Acciones</th></tr>";
    revs.forEach(r => {
      html += "<tr><td>" + r.id + "</td><td>" + r.usuario + "</td><td>" + r.nombre + "</td><td>" + r.codigo + "</td><td>" + r.comision_pct + "%</td><td>" + (r.activo ? "si" : "no") + "</td><td class='fila-botones'><button class='secundario' onclick='cambiarComision(" + r.id + ", " + r.comision_pct + ")'>Comision</button><button class='" + (r.activo ? "peligro" : "") + "' onclick='alternarActivo(" + r.id + ", " + !r.activo + ")'>" + (r.activo ? "Desactivar" : "Activar") + "</button></td></tr>";
    });
    document.getElementById("lista-revendedores").innerHTML = html + "</table>";
  } catch (e) { aviso(e.message, true); }
}

async function cambiarComision(id, actual) {
  const nueva = prompt("Nueva comision % para el revendedor " + id + " (actual " + actual + "%):");
  if (nueva === null) return;
  try { await api("/admin/revendedores/" + id, "PUT", { comision_pct: parseFloat(nueva) }); aviso("Comision actualizada"); cargarRevendedores(); }
  catch (e) { aviso(e.message, true); }
}

async function alternarActivo(id, activo) {
  try { await api("/admin/revendedores/" + id, "PUT", { activo: activo }); aviso("Revendedor " + (activo ? "activado" : "desactivado")); cargarRevendedores(); }
  catch (e) { aviso(e.message, true); }
}

// ---------- AUDITORIA ----------
async function cargarAuditoria() {
  try {
    const logs = await api("/admin/auditoria", "GET");
    let html = "<table><tr><th>Fecha</th><th>Usuario</th><th>Accion</th><th>Detalle</th></tr>";
    logs.forEach(l => {
      html += "<tr><td>" + l.fecha.slice(0, 19).replace("T", " ") + "</td><td>" + (l.nombre_usuario || "-") + "</td><td>" + l.accion + "</td><td>" + (l.detalle || "") + "</td></tr>";
    });
    document.getElementById("lista-auditoria").innerHTML = html + "</table>";
  } catch (e) { aviso(e.message, true); }
}

// Al abrir la pagina, si hay token guardado, entrar directo
if (token) { mostrarPanel(); }
</script>
</body>
</html>
