<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFALO - Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  .contenedor { max-width: 1050px; margin: 0 auto; padding: 16px; }
  h1 { color: #22c55e; margin-bottom: 8px; }
  h2 { margin: 16px 0 8px; color: #93c5fd; }
  .tarjeta { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 6px 0 2px; font-size: 14px; color: #94a3b8; }
  input, select, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  textarea { min-height: 70px; resize: vertical; }
  input[type="checkbox"] { width: auto; margin-right: 8px; }
  .check-linea { display: flex; align-items: center; margin: 10px 0; font-size: 14px; color: #e2e8f0; }
  button { margin: 6px 4px 0 0; padding: 8px 14px; border: none; border-radius: 6px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  button.secundario { background: #334155; color: #e2e8f0; }
  button.peligro { background: #dc2626; color: #fff; }
  button.wa { background: #25D366; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { padding: 6px 6px; border-bottom: 1px solid #334155; text-align: left; }
  th { color: #93c5fd; }
  .mensaje { padding: 10px; border-radius: 6px; margin: 8px 0; display: none; white-space: pre-line; }
  .mensaje.ok { display: block; background: #14532d; }
  .mensaje.error { display: block; background: #7f1d1d; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .tabs button { background: #334155; color: #e2e8f0; }
  .tabs button.activa { background: #22c55e; color: #052e16; }
  .chico { font-size: 12px; color: #94a3b8; }
  .reglas-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; margin: 8px 0; font-size: 13px; color: #fbbf24; white-space: pre-line; }
  .aviso-box { background: #713f12; border: 1px solid #fbbf24; color: #fef3c7; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; }
  .modo-box { background: #1e3a8a; border: 2px solid #60a5fa; color: #dbeafe; border-radius: 6px; padding: 10px; margin: 8px 0; font-size: 14px; }
  .cobro-box { background: #14532d; border: 1px solid #22c55e; color: #dcfce7; border-radius: 6px; padding: 10px; margin: 8px 0; font-size: 13px; }
  .buscador-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin: 8px 0; font-size: 13px; }
  .buscador-box .nums { font-family: monospace; font-size: 15px; color: #fbbf24; margin: 6px 0; }
  .buscador-box .ok { color: #22c55e; font-weight: bold; }
  .buscador-box .warn { color: #f59e0b; font-weight: bold; }
  .wa-links { background: #0f172a; border: 1px solid #25D366; border-radius: 6px; padding: 10px; margin-top: 8px; }
  .wa-links a { color: #25D366; display: inline-block; margin: 4px 8px 4px 0; text-decoration: underline; }
  .pozo-grande { background: #14532d; border: 2px solid #22c55e; color: #dcfce7; border-radius: 10px; padding: 14px; margin: 10px 0; text-align: center; font-size: 22px; font-weight: bold; }
  .pozo-grande span { color: #22c55e; font-size: 28px; }
  .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .grilla { grid-template-columns: 1fr; } }

  /* ---------- RESPONSIVE (telefono) ---------- */
  @media (max-width: 760px) {
    .contenedor { padding: 8px; }
    h1 { font-size: 20px; }
    h2 { font-size: 17px; }
    table { display: block; overflow-x: auto; white-space: nowrap; font-size: 12px; }
    th, td { padding: 4px 4px; }
    button { padding: 6px 8px; font-size: 12px; margin: 3px 2px 0 0; }
    .tabs button { font-size: 12px; padding: 6px 8px; }
    .tabs { gap: 4px; }
    .pozo-grande { font-size: 16px; padding: 10px; }
    .pozo-grande span { font-size: 20px; }
    .grilla { grid-template-columns: 1fr; }
    input, select, textarea { font-size: 14px; }
    .reglas-box, .buscador-box { font-size: 12px; }
  }

  /* ---------- MARCA RIFALO (solo jugador) - estilo casino ---------- */
  .marca-jugador {
    background:
      radial-gradient(circle at 15% 20%, rgba(217,70,239,0.35), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(59,130,246,0.35), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,197,94,0.25), transparent 45%),
      linear-gradient(160deg, #1a0b2e 0%, #2d1b4e 40%, #14143c 100%);
    border-radius: 16px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 0 40px rgba(168,85,247,0.25) inset;
  }
  .marca-logo { text-align: center; margin: 4px 0 12px; }
  .marca-logo img { width: min(340px, 88%); height: auto; filter: drop-shadow(0 4px 18px rgba(255,193,7,0.45)); }
  .marca-jugador .tarjeta {
    background: rgba(12, 8, 32, 0.65);
    border: 1px solid rgba(255,193,7,0.35);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 0 18px rgba(168,85,247,0.15);
    backdrop-filter: blur(4px);
  }
  .marca-jugador h2 {
    color: #FFC107;
    text-shadow: 0 0 12px rgba(255,193,7,0.5);
    letter-spacing: 0.5px;
  }
  .marca-jugador .chico { color: #d8c9f5; }
  .marca-jugador label { color: #d8c9f5; }
  .marca-jugador input, .marca-jugador select, .marca-jugador textarea {
    background: rgba(8,5,24,0.8);
    border: 1px solid rgba(255,193,7,0.3);
    color: #fff;
    border-radius: 8px;
  }
  .marca-jugador button {
    background: linear-gradient(180deg, #ffd54f, #FFC107);
    color: #1a0b2e;
    box-shadow: 0 3px 10px rgba(255,193,7,0.4);
    border-radius: 8px;
  }
  .marca-jugador button.secundario { background: rgba(255,255,255,0.14); color: #fff; box-shadow: none; }
  .marca-jugador button.peligro { background: #ef4444; color: #fff; }
  .marca-jugador table th { color: #FFC107; }
  .marca-jugador table td { color: #f0e9ff; }
  .marca-jugador .reglas-box {
    background: rgba(8,5,24,0.7);
    border: 1px solid rgba(255,193,7,0.4);
    color: #ffd76a;
    border-radius: 8px;
  }
  .marca-jugador .pozo-grande {
    background: linear-gradient(160deg, #064e3b, #065f46 50%, #047857);
    border: 2px solid #22c55e;
    color: #ffffff;
    border-radius: 14px;
    box-shadow: 0 0 22px rgba(34,197,94,0.55), 0 6px 18px rgba(0,0,0,0.4);
    animation: pulsoPozo 2.2s ease-in-out infinite;
  }
  .marca-jugador .pozo-grande span {
    color: #a7f3d0;
    text-shadow: 0 0 14px rgba(74,222,128,0.8);
  }
  @keyframes pulsoPozo {
    0%,100% { box-shadow: 0 0 14px rgba(34,197,94,0.4), 0 6px 18px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 30px rgba(34,197,94,0.75), 0 6px 18px rgba(0,0,0,0.4); }
  }
</style>
</head>
<body>
<div class="contenedor">

  <!-- LOGIN -->
  <div id="zona-login" class="tarjeta">
    <h1>RIFALO</h1>
    <div id="bloque-login">
      <p class="chico">Ingreso por rol: admin, vendedor, revendedor o jugador</p>
      <label>Usuario</label><input id="login-usuario">
      <label>Contrasenia</label><input id="login-password" type="password">
      <label>Codigo 2FA (solo si lo tenes activado)</label><input id="login-2fa">
      <button onclick="login()">Entrar</button>
      <button class="secundario" onclick="mostrarRegistro()">Soy jugador: registrarme</button>
    </div>
    <div id="login-error" class="mensaje error"></div>
    <div id="login-msg" class="mensaje"></div>
    <div id="form-registro" style="display:none; margin-top:14px">
      <h2>Registro de jugador</h2>
      <label>Usuario</label><input id="reg-usuario">
      <label>Contrasenia</label><input id="reg-password" type="password">
      <label>Nombre y apellido</label><input id="reg-nombre">
      <label>Telefono (con prefijo, ej: 5491123456789)</label><input id="reg-telefono">
      <label>Codigo de tu vendedor o revendedor</label><input id="reg-codigo">
      <label>Alias o CBU (para cobrarte tus premios)</label><input id="reg-cobro" placeholder="tu.alias o CBU de 22 digitos">
      <div class="check-linea"><input type="checkbox" id="reg-transferencia" checked><span>Cobrar mis premios por transferencia</span></div>
      <button onclick="registrarJugador()">Registrarme</button>
      <div id="reg-msg" class="mensaje"></div>
    </div>
  </div>

  <!-- PANEL (casco): las secciones de cada rol se inyectan en contenedor-secciones -->
  <div id="zona-panel" style="display:none">
    <h1>RIFALO <span class="chico" id="panel-usuario"></span></h1>
    <div class="tabs" id="barra-tabs"></div>
    <div id="zona-modo" class="modo-box" style="display:none"></div>
    <div id="zona-avisos"></div>
    <div id="mensaje" class="mensaje"></div>
    <div id="contenedor-secciones"></div>
  </div>
</div>

<script src="/static/js/panel-comun.js"></script>
<script src="/static/js/panel-admin.js"></script>
<script src="/static/js/panel-vendedor.js"></script>
<script src="/static/js/panel-revendedor.js"></script>
<script src="/static/js/panel-jugador.js"></script>
</body>
</html>
